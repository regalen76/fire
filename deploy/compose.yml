# docker compose -f deploy/compose.yml up -d   (from the repo root)
# Secrets live in deploy/fire.env (git-ignored); start from backend/.env.example.
services:
  fire:
    build: ..
    image: fire
    restart: unless-stopped
    env_file: fire.env
    environment:
      # Inside the container; the port below is published on localhost only.
      HOST: 0.0.0.0
      FIRE_STATIC_DIR: /app/dist
    # A relative TURSO_DATABASE_URL (file:fire.db) lands in the fire-data volume.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - fire-data:/data
volumes:
  fire-data:
