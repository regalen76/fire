<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--navy-900);color:#fff;font-family:var(--font-sans);padding:20px;box-sizing:border-box}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.08)}.n{font-size:12px;color:#fff}.v{font-size:10px;color:var(--gray-400);font-family:ui-monospace,monospace}</style></head><body><div style="display:flex;gap:16px;align-items:flex-end"><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:4px;height:4px;background:var(--blue-500);border-radius:3px"></div><span class="v">--space-1<br>4px</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:8px;height:8px;background:var(--blue-500);border-radius:3px"></div><span class="v">--space-2<br>8px</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:12px;height:12px;background:var(--blue-500);border-radius:3px"></div><span class="v">--space-3<br>12px</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:16px;height:16px;background:var(--blue-500);border-radius:3px"></div><span class="v">--space-4<br>16px</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:20px;height:20px;background:var(--blue-500);border-radius:3px"></div><span class="v">--space-5<br>20px</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:22px;height:22px;background:var(--blue-500);border-radius:3px"></div><span class="v">--space-6<br>22px</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><div style="width:24px;height:24px;background:var(--blue-500);border-radius:3px">
