<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--navy-900);color:#fff;font-family:var(--font-sans);padding:20px;box-sizing:border-box}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.08)}.n{font-size:12px;color:#fff}.v{font-size:10px;color:var(--gray-400);font-family:ui-monospace,monospace}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--blue-500)"></div><span class="n">Blue 500 · accent</span><span class="v">--blue-500<br>rgb(0,117,255)</span></div><div class="sw"><div class="chip" style="background:var(--blue-400)"></div><span class="n">Blue 400</span><span class="v">--blue-400<br>rgb(38,132,255)</span></div><div class="sw"><div class="chip" style="background:var(--cyan-400)"></div><span class="n">Cyan 400 · chart</span><span class="v">--cyan-400<br>rgb(44,217,255)</span></div><div class="sw"><div class="chip" style="background:var(--violet-600)"></div><span class="n">Violet 600</span><span class="v">--violet-600<br>rgb(67,24,255)</span></div><div class="sw"><div class="chip" style="background:var(--violet-500)"></div><span class="n">Violet 500</span><span class="v">--violet-500<br>rgb(88,44,255)</span></div><div class="sw"><div class="chip" style="background:var(--teal-400)"></div><span class="n">Teal 400</span><span class="v">--teal-400<br>rgb(79,209,197)</span></div></div></body></html>
