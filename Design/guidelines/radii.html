<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--navy-900);color:#fff;font-family:var(--font-sans);padding:20px;box-sizing:border-box}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.08)}.n{font-size:12px;color:#fff}.v{font-size:10px;color:var(--gray-400);font-family:ui-monospace,monospace}</style></head><body><div class="row"><div class="sw"><div style="height:64px;border-radius:6px;background:var(--navy-700);box-shadow:inset 0 0 0 1px var(--navy-400)"></div><span class="n">mini tile</span><span class="v">--radius-xs · 6px</span></div><div class="sw"><div style="height:64px;border-radius:8px;background:var(--navy-700);box-shadow:inset 0 0 0 1px var(--navy-400)"></div><span class="n">status chip</span><span class="v">--radius-sm · 8px</span></div><div class="sw"><div style="height:64px;border-radius:12px;background:var(--navy-700);box-shadow:inset 0 0 0 1px var(--navy-400)"></div><span class="n">button / tile</span><span class="v">--radius-md · 12px</span></div><div class="sw"><div style="height:64px;border-radius:15px;background:var(--navy-700);box-shadow:inset 0 0 0 1px var(--navy-400)"></div><span class="n">nav / input</span><span class="v">--radius-lg · 15px</span></div><div class="sw"><div style="height:64px;border-radius:20px;background:var(--navy-700);box-shadow:inset 0 0 0 1px var(--navy-400)"></div><span class="n">card</span><span class="v">--radius-xl · 20px</span></div><div class="sw"><div style="height:64px;border-radius:999px;background:var(--navy-700);box-shadow:inset 0 0 0 1px var(--navy-400)"></div><span class="n">switch</span><span class="v">--radius-pill · 999px</span></div></div></body></html>
