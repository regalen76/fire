<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--navy-900);color:#fff;font-family:var(--font-sans);padding:20px;box-sizing:border-box}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.08)}.n{font-size:12px;color:#fff}.v{font-size:10px;color:var(--gray-400);font-family:ui-monospace,monospace}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--white)"></div><span class="n">Primary</span><span class="v">--white<br>rgb(255,255,255)</span></div><div class="sw"><div class="chip" style="background:var(--gray-100)"></div><span class="n">Balance label</span><span class="v">--gray-100<br>rgb(233,237,247)</span></div><div class="sw"><div class="chip" style="background:var(--gray-300)"></div><span class="n">Gray 300</span><span class="v">--gray-300<br>rgb(203,213,224)</span></div><div class="sw"><div class="chip" style="background:var(--gray-400)"></div><span class="n">Secondary</span><span class="v">--gray-400<br>rgb(160,174,192)</span></div><div class="sw"><div class="chip" style="background:var(--gray-500)"></div><span class="n">Muted · header</span><span class="v">--gray-500<br>rgb(113,128,150)</span></div></div></body></html>
