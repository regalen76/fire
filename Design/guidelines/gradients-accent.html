<!-- @dsCard group="Colors" viewport="700x150" name="Accent gradients" subtitle="Card, score disc, chart fills, glass button" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--navy-900);color:#fff;font-family:var(--font-sans);padding:20px;box-sizing:border-box}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.08)}.n{font-size:12px;color:#fff}.v{font-size:10px;color:var(--gray-400);font-family:ui-monospace,monospace}</style></head><body><div class="row"><div class="sw"><div class="chip" style="height:72px;background:var(--gradient-card-violet)"></div><span class="v">--gradient-card-violet</span></div><div class="sw"><div class="chip" style="height:72px;background:var(--gradient-score)"></div><span class="v">--gradient-score</span></div><div class="sw"><div class="chip" style="height:72px;background:var(--gradient-chart-blue)"></div><span class="v">--gradient-chart-blue</span></div><div class="sw"><div class="chip" style="height:72px;background:var(--gradient-chart-cyan)"></div><span class="v">--gradient-chart-cyan</span></div><div class="sw"><div class="chip" style="height:72px;background:var(--gradient-chart-green)"></div><span class="v">--gradient-chart-green</span></div><div class="sw"><div class="chip" style="height:72px;background:var(--gradient-button-glass)"></div><span class="v">--gradient-button-glass</span></div><div class="sw"><div class="chip" style="height:72px;background:var(--gradient-app-bg)"></div><span class="v">--gradient-app-bg</span></div></div></body></html>
