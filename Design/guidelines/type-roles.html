<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--navy-900);color:#fff;font-family:var(--font-sans);padding:20px;box-sizing:border-box}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.08)}.n{font-size:12px;color:#fff}.v{font-size:10px;color:var(--gray-400);font-family:ui-monospace,monospace}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:18px"><div><div style="font:var(--text-card-title)">Sales overview</div><div style="font:var(--text-body);color:var(--gray-400)">(+5) more in 2021</div><span class="v">--text-card-title / --text-body + gray-400</span></div><div><div style="font:var(--text-overline);color:var(--gray-400)">NEWEST</div><div style="font:var(--text-body)">Netflix</div><span class="v">--text-overline (10px uppercase)</span></div><div><div style="font:var(--text-button);text-transform:uppercase">Add a new card</div><span class="v">--text-button (10px bold uppercase)</span></div><div><div style="font-size:14px;letter-spacing:0.18em">VISION UI FREE</div><span class="v">Wordmark · 14px · 0.18em</span></div></div></body></html>
