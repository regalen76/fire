<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--navy-900);color:#fff;font-family:var(--font-sans);padding:20px;box-sizing:border-box}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.08)}.n{font-size:12px;color:#fff}.v{font-size:10px;color:var(--gray-400);font-family:ui-monospace,monospace}</style></head><body><div style="display:flex;gap:16px;align-items:center"><div id="s" style="height:90px;width:264px;border-radius:20px;background:var(--gradient-sidebar);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);transition:width var(--dur-slow) var(--ease-out);display:flex;align-items:center;padding:0 16px;box-sizing:border-box;gap:15px;overflow:hidden"><span style="width:30px;height:30px;border-radius:12px;background:var(--blue-500);flex-shrink:0"></span><span id="l" style="font-size:14px;white-space:nowrap;transition:opacity var(--dur-base) var(--ease-out)">Dashboard</span></div><span class="v">--ease-out: cubic-bezier(0.22,1,0.36,1)<br>--dur-fast 150 · --dur-base 250 · --dur-slow 350</span></div><script>let c=false;setInterval(()=>{c=!c;s.style.width=c?'62px':'264px';l.style.opacity=c?0:1},1600)</script></body></html>
