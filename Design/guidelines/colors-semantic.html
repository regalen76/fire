<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Income, expense, danger, warning" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--navy-900);color:#fff;font-family:var(--font-sans);padding:20px;box-sizing:border-box}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.08)}.n{font-size:12px;color:#fff}.v{font-size:10px;color:var(--gray-400);font-family:ui-monospace,monospace}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--green-500)"></div><span class="n">Income / up</span><span class="v">--green-500<br>rgb(1,181,116)</span></div><div class="sw"><div class="chip" style="background:var(--green-400)"></div><span class="n">Score</span><span class="v">--green-400<br>rgb(5,205,153)</span></div><div class="sw"><div class="chip" style="background:var(--red-500)"></div><span class="n">Expense / down</span><span class="v">--red-500<br>rgb(227,26,26)</span></div><div class="sw"><div class="chip" style="background:var(--red-400)"></div><span class="n">Danger · DELETE</span><span class="v">--red-400<br>rgb(245,60,43)</span></div><div class="sw"><div class="chip" style="background:var(--orange-400)"></div><span class="n">Warning</span><span class="v">--orange-400<br>rgb(247,158,27)</span></div></div></body></html>
