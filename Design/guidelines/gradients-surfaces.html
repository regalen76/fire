<!-- @dsCard group="Colors" viewport="700x170" name="Glass gradients" subtitle="Card, stat, inset, row, sidebar — always with 120px backdrop blur" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--navy-900);color:#fff;font-family:var(--font-sans);padding:20px;box-sizing:border-box}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.08)}.n{font-size:12px;color:#fff}.v{font-size:10px;color:var(--gray-400);font-family:ui-monospace,monospace}</style></head><body><div class="row" style="padding:14px;border-radius:20px;background:url(../assets/images/bg-dashboard.jpg) center/cover"><div class="sw"><div class="chip" style="height:84px;border-radius:20px;background:var(--gradient-card);backdrop-filter:blur(120px)"></div><span class="v" style="color:#fff">--gradient-card</span></div><div class="sw"><div class="chip" style="height:84px;border-radius:20px;background:var(--gradient-stat);backdrop-filter:blur(120px)"></div><span class="v" style="color:#fff">--gradient-stat</span></div><div class="sw"><div class="chip" style="height:84px;border-radius:20px;background:var(--gradient-card-soft);backdrop-filter:blur(120px)"></div><span class="v" style="color:#fff">--gradient-card-soft</span></div><div class="sw"><div class="chip" style="height:84px;border-radius:20px;background:var(--gradient-inset);backdrop-filter:blur(120px)"></div><span class="v" style="color:#fff">--gradient-inset</span></div><div class="sw"><div class="chip" style="height:84px;border-radius:20px;background:var(--gradient-row);backdrop-filter:blur(120px)"></div><span class="v" style="color:#fff">--gradient-row</span></div><div class="sw"><div class="chip" style="height:84px;border-radius:20px;background:var(--gradient-sidebar);backdrop-filter:blur(120px)"></div><span class="v" style="color:#fff">--gradient-sidebar</span></div><div class="sw"><div class="chip" style="height:84px;border-radius:20px;background:var(--gradient-balance);backdrop-filter:blur(120px)"></div><span class="v" style="color:#fff">--gradient-balance</span></div></div></body></html>
