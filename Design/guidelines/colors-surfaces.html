<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--navy-900);color:#fff;font-family:var(--font-sans);padding:20px;box-sizing:border-box}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.08)}.n{font-size:12px;color:#fff}.v{font-size:10px;color:var(--gray-400);font-family:ui-monospace,monospace}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--navy-950)"></div><span class="n">950</span><span class="v">--navy-950<br>rgb(2,5,21)</span></div><div class="sw"><div class="chip" style="background:var(--navy-900)"></div><span class="n">900 · app</span><span class="v">--navy-900<br>rgb(6,11,38)</span></div><div class="sw"><div class="chip" style="background:var(--navy-800)"></div><span class="n">800</span><span class="v">--navy-800<br>rgb(15,18,59)</span></div><div class="sw"><div class="chip" style="background:var(--navy-750)"></div><span class="n">750 · input</span><span class="v">--navy-750<br>rgb(15,21,53)</span></div><div class="sw"><div class="chip" style="background:var(--navy-700)"></div><span class="n">700 · nav active</span><span class="v">--navy-700<br>rgb(26,31,55)</span></div><div class="sw"><div class="chip" style="background:var(--navy-500)"></div><span class="n">500 · track</span><span class="v">--navy-500<br>rgb(45,46,95)</span></div><div class="sw"><div class="chip" style="background:var(--navy-400)"></div><span class="n">400 · divider</span><span class="v">--navy-400<br>rgb(86,87,122)</span></div></div></body></html>
