<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vision Finance</title>
<link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0;color:#fff;font-family:var(--font-sans)}body{min-height:100vh}*{box-sizing:border-box}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
</head><body class="vf-app-bg"><div id="root"></div>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="DashboardScreen.jsx"></script>
<script type="text/babel" src="TransactionsScreen.jsx"></script>
<script type="text/babel" src="AccountsScreen.jsx"></script>
<script type="text/babel" src="ReceiptsScreen.jsx"></script>
<script type="text/babel" src="TransactionDrawer.jsx"></script>
<script type="text/babel" src="SignInScreen.jsx"></script>
<script type="text/babel">
function App(){
  const [page,setPage]=React.useState(()=>localStorage.getItem('vf-page')||'dashboard');
  const [collapsed,setCollapsed]=React.useState(()=>localStorage.getItem('vf-collapsed')==='1');
  const [tx,setTx]=React.useState(null);
  const nav=p=>{if(p==='signin'){setPage('signin');return;}setPage(p);localStorage.setItem('vf-page',p);};
  const tog=c=>{setCollapsed(c);localStorage.setItem('vf-collapsed',c?'1':'0');};
  if(page==='signin') return <SignInScreen onSignIn={()=>nav('dashboard')}/>;
  const screens={dashboard:<DashboardScreen onOpenTx={setTx} onNav={nav}/>,transactions:<TransactionsScreen onOpenTx={setTx}/>,accounts:<AccountsScreen onOpenTx={setTx}/>,receipts:<ReceiptsScreen onOpenTx={setTx}/>,profile:<div style={{color:'var(--gray-400)',fontSize:14,padding:40,textAlign:'center'}}>Profile screen not included in this kit.</div>};
  return (<><Shell page={page} onNav={nav} collapsed={collapsed} onToggle={tog}>{screens[page]}</Shell><TransactionDrawer tx={tx} onClose={()=>setTx(null)}/></>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
